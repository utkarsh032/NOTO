name: Setup workspace
description: Install pnpm, Node and the Noto workspace dependencies with caching.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '24'
  install:
    description: Whether to run `pnpm install`.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # No `version` input: pnpm/action-setup reads the `packageManager` field in
    # the root package.json, so CI always matches the pinned local version.
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    # Turborepo's local cache; keyed on the lockfile so a dependency change
    # starts a fresh cache rather than restoring a stale one.
    - name: Restore Turbo cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-
