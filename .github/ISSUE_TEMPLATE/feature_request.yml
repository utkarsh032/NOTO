name: Feature request
description: Suggest a capability Noto does not have yet.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false

  - type: dropdown
    id: platforms
    attributes:
      label: Which platforms would this apply to?
      multiple: true
      options:
        - Web
        - Desktop
        - Mobile
        - All
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This keeps Noto usable offline and without an account.
          required: false
