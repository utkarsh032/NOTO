name: Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the packages (defaults to the workspace version).
        type: string
        required: false
        default: ''
      sign:
        description: Sign and notarize the packages (requires the signing secrets).
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
      sign:
        type: boolean
        required: false
        default: false

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      # One platform failing should not hide the state of the others; a release
      # needs to know every platform's verdict in a single run.
      fail-fast: false
      matrix:
        include:
          - { label: Windows x64, os: windows-latest, platform: win32, arch: x64 }
          - { label: Windows arm64, os: windows-latest, platform: win32, arch: arm64 }
          # Electron Packager downloads the Electron binary for the requested
          # architecture, so both macOS slices cross-build from one arm64 runner.
          - { label: macOS arm64, os: macos-latest, platform: darwin, arch: arm64 }
          - { label: macOS x64, os: macos-latest, platform: darwin, arch: x64 }
          - { label: Linux x64, os: ubuntu-latest, platform: linux, arch: x64 }

    steps:
      - uses: actions/checkout@v4

      # Node 22, not 24. Electron Forge 7.11 pins @electron/packager 18.4.4,
      # which exits silently with status 0 while extracting the Electron archive
      # on Node 24 — no `out/` directory, no error. See the packaging note in
      # README.md. Revert to the default once Forge bumps its packager.
      - uses: ./.github/actions/setup
        with:
          node-version: '22'

      # `dpkg`/`fakeroot` back the .deb maker, `rpm` the .rpm maker, and
      # squashfs/fuse the AppImage maker.
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fakeroot dpkg rpm squashfs-tools desktop-file-utils
          sudo apt-get install --no-install-recommends -y libfuse2t64 || \
            sudo apt-get install --no-install-recommends -y libfuse2 || \
            echo "::notice::libfuse2 unavailable; AppImage build continues without runtime FUSE."

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            node scripts/version.mjs set "${{ inputs.version }}"
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # No separate build step for the shared packages: they are consumed as
      # TypeScript source and Forge's Vite plugin bundles them as part of `make`.

      # The certificate lives in secrets as base64 so it survives the secret
      # store unchanged; it is written outside the repository tree and removed
      # again once the makers have run.
      - name: Decode Windows signing certificate
        if: matrix.platform == 'win32' && inputs.sign
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$WINDOWS_CERTIFICATE_BASE64" ]; then
            echo "::error::sign was requested but WINDOWS_CERTIFICATE_BASE64 is not set."
            exit 1
          fi
          echo "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.pfx"

      - name: Import Apple signing certificate
        if: matrix.platform == 'darwin' && inputs.sign
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "::error::sign was requested but APPLE_CERTIFICATE_BASE64 is not set."
            exit 1
          fi
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Package and make
        shell: bash
        env:
          NOTO_VERSION: ${{ steps.version.outputs.value }}
          # Signing is opt-in. `forge.config.ts` only enables the signing and
          # notarization hooks when these are present, so unsigned development
          # builds need no certificates at all.
          NOTO_SIGN: ${{ inputs.sign }}
          # Windows Authenticode.
          WINDOWS_CERTIFICATE_FILE: ${{ runner.temp }}/certificate.pfx
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Apple signing and notarization.
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @noto/desktop exec electron-forge make --arch=${{ matrix.arch }}

      - name: Collect release assets
        shell: bash
        run: |
          node scripts/collect-desktop-artifacts.mjs \
            --platform ${{ matrix.platform }} \
            --arch ${{ matrix.arch }} \
            --version ${{ steps.version.outputs.value }} \
            --out dist/release

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release
          retention-days: 14
          if-no-files-found: error

      - name: Remove signing material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/certificate.pfx" "$RUNNER_TEMP/certificate.p12"
