name: Desktop

on:
  # Path-filtered so that an unrelated change never spends five runners on a
  # packaging matrix. Mirrors the filter web.yml already uses.
  push:
    branches: [main, dev]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'tooling/**'
      - 'scripts/bake-environment.mjs'
      - 'scripts/collect-desktop-artifacts.mjs'
      - 'scripts/verify-squirrel-release.mjs'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/desktop.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the packages (defaults to the workspace version).
        type: string
        required: false
        default: ''
      environment:
        description: Overlay to bake in. Must name a file in apps/desktop/environments.
        type: choice
        options: [Development, Staging, Production]
        default: Production
      channel:
        description: Update channel. Empty uses the environment's defaultChannel.
        type: choice
        options: ['', stable, beta, nightly]
        default: ''
      sign:
        description: Sign and notarize the packages (requires the signing secrets).
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      # The commit to package. A called workflow otherwise checks out the ref
      # that triggered the caller, which is right for a tag push and wrong for
      # every `workflow_dispatch` re-run: those name the tag as an input while
      # the run itself is started from a branch, so the packages would be built
      # from that branch and then labelled with the tag's version.
      ref:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: false
        default: ''
      environment:
        type: string
        required: false
        default: Production
      channel:
        type: string
        required: false
        default: ''
      sign:
        type: boolean
        required: false
        default: false

# Keyed by environment as well as ref: the same commit packaged for two
# environments produces two different artifacts, and one must not cancel the
# other.
concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.environment }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.pick.outputs.include }}
      environment: ${{ steps.pick.outputs.environment }}
      channel: ${{ steps.pick.outputs.channel }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Pick the platform matrix and environment
        id: pick
        shell: bash
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          # Discriminated on whether an environment was supplied, NOT on
          # github.event_name. In a reusable workflow that context belongs to
          # the caller, so a tag push through release.yml reports "push" here -
          # and matching on that would quietly build Windows alone and drop
          # macOS and Linux from every release. Both workflow_call and
          # workflow_dispatch always carry an environment; a bare push cannot.
          #
          # A bare push is a smoke test of the packaging path, not a release.
          # One Windows slice proves Forge still produces an installer; the full
          # five-platform matrix is what a release needs and what it pays for.
          if [ -z "${INPUT_ENVIRONMENT:-}" ]; then
            include='[{"label":"Windows x64","os":"windows-latest","platform":"win32","arch":"x64"}]'
            environment="Development"
          else
            include='[
              {"label":"Windows x64","os":"windows-latest","platform":"win32","arch":"x64"},
              {"label":"Windows arm64","os":"windows-latest","platform":"win32","arch":"arm64"},
              {"label":"macOS arm64","os":"macos-latest","platform":"darwin","arch":"arm64"},
              {"label":"macOS x64","os":"macos-latest","platform":"darwin","arch":"x64"},
              {"label":"Linux x64","os":"ubuntu-latest","platform":"linux","arch":"x64"}
            ]'
            environment="$INPUT_ENVIRONMENT"
          fi

          # The overlay set lives on disk. Validating against it here means a
          # workflow input that has drifted away from the files fails at the
          # start of the run rather than producing a package aimed at an update
          # feed nobody meant to ship.
          if [ ! -f "apps/desktop/environments/noto.${environment}.json" ]; then
            echo "::error::No overlay apps/desktop/environments/noto.${environment}.json."
            echo "::error::Available: $(ls apps/desktop/environments | paste -sd' ' -)"
            exit 1
          fi

          # Control characters only, not [:space:]: GITHUB_OUTPUT needs one line,
          # but stripping every space would also collapse the labels inside the
          # JSON, and those labels are what name each job in the UI.
          echo "include=$(echo "$include" | tr -d '[:cntrl:]')" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "channel=${INPUT_CHANNEL:-}" >> "$GITHUB_OUTPUT"
          echo "Building $environment on the ${INPUT_CHANNEL:-default} channel."

  package:
    name: ${{ matrix.label }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      # One platform failing should not hide the state of the others; a release
      # needs to know every platform's verdict in a single run.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.include) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Node 22, not 24. Electron Forge 7.11 pins @electron/packager 18.4.4,
      # which exits silently with status 0 while extracting the Electron archive
      # on Node 24 — no `out/` directory, no error. See the packaging note in
      # README.md. Revert to the default once Forge bumps its packager.
      - uses: ./.github/actions/setup
        with:
          node-version: '22'

      # `dpkg`/`fakeroot` back the .deb maker, `rpm` the .rpm maker, and
      # squashfs/fuse the AppImage maker.
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fakeroot dpkg rpm squashfs-tools desktop-file-utils
          sudo apt-get install --no-install-recommends -y libfuse2t64 || \
            sudo apt-get install --no-install-recommends -y libfuse2 || \
            echo "::notice::libfuse2 unavailable; AppImage build continues without runtime FUSE."

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            node scripts/version.mjs set "${{ inputs.version }}"
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # Baked before the bundle is built, using the same script the local
      # release runs. Skipping this would package the committed Development
      # defaults - the wrong update feed - and nothing downstream would notice,
      # because the artifact's name does not record which environment it is for.
      - name: Bake the environment
        shell: bash
        run: |
          node scripts/bake-environment.mjs \
            --environment '${{ needs.resolve.outputs.environment }}' \
            --channel '${{ needs.resolve.outputs.channel }}'

      # No separate build step for the shared packages: they are consumed as
      # TypeScript source and Forge's Vite plugin bundles them as part of `make`.

      # The certificate lives in secrets as base64 so it survives the secret
      # store unchanged; it is written outside the repository tree and removed
      # again once the makers have run.
      - name: Decode Windows signing certificate
        if: matrix.platform == 'win32' && inputs.sign
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$WINDOWS_CERTIFICATE_BASE64" ]; then
            echo "::error::sign was requested but WINDOWS_CERTIFICATE_BASE64 is not set."
            exit 1
          fi
          echo "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.pfx"

      - name: Import Apple signing certificate
        if: matrix.platform == 'darwin' && inputs.sign
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "::error::sign was requested but APPLE_CERTIFICATE_BASE64 is not set."
            exit 1
          fi
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Package and make
        shell: bash
        env:
          NOTO_VERSION: ${{ steps.version.outputs.value }}
          # Signing is opt-in. `forge.config.ts` only enables the signing and
          # notarization hooks when these are present, so unsigned development
          # builds need no certificates at all.
          NOTO_SIGN: ${{ inputs.sign }}
          # Windows Authenticode.
          WINDOWS_CERTIFICATE_FILE: ${{ runner.temp }}/certificate.pfx
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Apple signing and notarization.
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Wrapped rather than run directly because this step hangs instead of
        # failing: the DMG maker's `hdiutil` intermittently stops responding on
        # the hosted macOS runners. That is what cost v1.1.2 — macOS arm64 sat
        # here for the full 45 minutes while the other four platforms finished
        # in under three, and the resulting *cancelled* job skipped the publish
        # step. A healthy make takes two to three minutes, so fifteen is a
        # generous deadline for one attempt and two attempts still land well
        # inside the job's budget.
        run: |
          node scripts/run-with-retry.mjs --timeout 15 --attempts 2 -- \
            pnpm --filter @noto/desktop exec electron-forge make --arch=${{ matrix.arch }}

      - name: Collect release assets
        shell: bash
        run: |
          node scripts/collect-desktop-artifacts.mjs \
            --platform ${{ matrix.platform }} \
            --arch ${{ matrix.arch }} \
            --version ${{ steps.version.outputs.value }} \
            --out build

      # The Squirrel manifest is checked here for the same reason the local
      # release checks it: nothing else ever reads RELEASES, so a hash that does
      # not describe the package beside it would only surface once installed
      # clients quietly stopped updating.
      - name: Verify the Windows update manifest
        if: matrix.platform == 'win32' && matrix.arch == 'x64'
        shell: bash
        run: |
          node scripts/verify-squirrel-release.mjs \
            --dir build \
            --version ${{ steps.version.outputs.value }} \
            --arch ${{ matrix.arch }}

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ needs.resolve.outputs.environment }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: build
          retention-days: 14
          if-no-files-found: error

      - name: Remove signing material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/certificate.pfx" "$RUNNER_TEMP/certificate.p12"
