name: Web

# Builds the website and the web application and keeps the bundles as
# artifacts.
#
# It deliberately does not deploy. Both applications are Cloudflare Workers
# projects connected to this repository through Workers Builds, so Cloudflare
# checks out the commit and runs the build and deploy commands itself on every
# push. A second deployment path here would race that one, need an API token
# GitHub does not otherwise require, and drift out of step with the
# `wrangler.jsonc` each project actually uses.
#
# What this job is for is a verdict: the bundles built, at this version, for
# this commit — visible on a pull request, where Cloudflare's own build is not.
#
# See docs/deployment/website.md.

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/web/**'
      - 'apps/website/**'
      - 'packages/**'
      - 'tooling/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/web.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to stamp into the build.
        type: choice
        options: [staging, production]
        default: staging
  workflow_call:
    inputs:
      # The commit to build. A called workflow otherwise checks out the ref
      # that triggered the caller, which is right for a tag push and wrong for
      # every `workflow_dispatch` re-run: those name the tag as an input while
      # the run itself is started from a branch.
      ref:
        type: string
        required: false
        default: ''
      environment:
        description: Environment to stamp into the build (staging or production).
        type: string
        required: false
        default: production
      version:
        description: Version string to bake into the builds.
        type: string
        required: false
        default: ''

concurrency:
  group: web-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: '@noto/web'
            dist: apps/web/dist
            label: web
          - app: '@noto/website'
            dist: apps/website/dist
            label: website

    env:
      # `push` events carry no inputs; derive the environment from the branch.
      NOTO_ENV: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.app }}
        env:
          VITE_NOTO_VERSION: ${{ steps.version.outputs.value }}
          VITE_NOTO_ENV: ${{ env.NOTO_ENV }}
          VITE_NOTO_COMMIT: ${{ github.sha }}
          VITE_NOTO_REPOSITORY: ${{ github.repository }}
        run: pnpm --filter ${{ matrix.app }}... run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-${{ env.NOTO_ENV }}
          path: ${{ matrix.dist }}
          retention-days: 14
          if-no-files-found: error
