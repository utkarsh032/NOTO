name: Web

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/web/**'
      - 'apps/website/**'
      - 'packages/**'
      - 'tooling/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/web.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment.
        type: choice
        options: [staging, production]
        default: staging
  workflow_call:
    inputs:
      environment:
        description: Target environment (staging or production).
        type: string
        required: false
        default: production
      version:
        description: Version string to bake into the builds.
        type: string
        required: false
        default: ''

concurrency:
  group: web-${{ inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: '@noto/web'
            dist: apps/web/dist
            project_var: CLOUDFLARE_PAGES_WEB_PROJECT
            default_project: noto-web
          - app: '@noto/website'
            dist: apps/website/dist
            project_var: CLOUDFLARE_PAGES_WEBSITE_PROJECT
            default_project: noto-website

    env:
      # `push` events carry no inputs; derive the environment from the branch.
      NOTO_ENV: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.app }}
        env:
          VITE_NOTO_VERSION: ${{ steps.version.outputs.value }}
          VITE_NOTO_ENV: ${{ env.NOTO_ENV }}
          VITE_NOTO_COMMIT: ${{ github.sha }}
          VITE_NOTO_REPOSITORY: ${{ github.repository }}
        run: pnpm --filter ${{ matrix.app }}... run build

      - name: Resolve Cloudflare Pages project
        id: project
        run: |
          project="${{ vars[matrix.project_var] }}"
          if [ -z "$project" ]; then project="${{ matrix.default_project }}"; fi
          echo "name=$project" >> "$GITHUB_OUTPUT"

      # Cloudflare credentials are optional so that forks and freshly cloned
      # repositories still get a full build verdict; only the upload is skipped.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping deployment of ${{ matrix.app }}."
          fi

      # Cloudflare Pages treats one branch as production and every other branch
      # as a preview deployment, so staging is published from `dev`.
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ${{ matrix.dist }}
            --project-name=${{ steps.project.outputs.name }}
            --branch=${{ env.NOTO_ENV == 'production' && 'main' || 'dev' }}
            --commit-hash=${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app == '@noto/web' && 'web' || 'website' }}-${{ env.NOTO_ENV }}
          path: ${{ matrix.dist }}
          retention-days: 14
          if-no-files-found: error
