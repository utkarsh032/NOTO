name: Mobile

# Mobile is a later phase than web and desktop, so nothing here runs on an
# ordinary push. It is triggered by hand or by the release workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the builds (defaults to the workspace version).
        type: string
        required: false
        default: ''
      android:
        description: Build Android.
        type: boolean
        default: true
      ios:
        description: Build iOS.
        type: boolean
        default: false
  workflow_call:
    inputs:
      # The commit to build. A called workflow otherwise checks out the ref
      # that triggered the caller, which is right for a tag push and wrong for
      # every `workflow_dispatch` re-run: those name the tag as an input while
      # the run itself is started from a branch.
      ref:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: false
        default: ''
      android:
        type: boolean
        required: false
        default: false
      ios:
        type: boolean
        required: false
        default: false
      # A release publishes the APK on the download page, so a build with no
      # upload keystore must fail rather than ship the shared debug key.
      require_signing:
        type: boolean
        required: false
        default: false

concurrency:
  group: mobile-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android
    if: inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup

      # React Native 0.86 targets JDK 17.
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            node scripts/version.mjs set "${{ inputs.version }}"
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # `apps/mobile/android` is generated, not committed, so the native project
      # is regenerated from app.json on every run.
      # Bounded because this step hangs rather than fails. A healthy prebuild
      # takes about a second; on 1.1.4 it sat here for the full 45-minute job
      # timeout and was reported as *cancelled*, which reads like somebody
      # pressed stop rather than like a broken build. Five minutes is a hundred
      # times the honest cost, so a stall now fails fast and says so.
      - name: Generate native Android project
        run: |
          node ../../scripts/run-with-retry.mjs --timeout 5 --attempts 2 -- \
            pnpm exec expo prebuild --platform android --no-install --clean
        working-directory: apps/mobile

      - name: Decode upload keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Whitespace is stripped rather than trusted. This secret is pasted by
          # hand out of a file, so an editor that soft-wrapped the line, or a
          # copy that brought a trailing newline with it, would otherwise reach
          # `base64 --decode` as invalid input — and the old message said only
          # that the key "is not set", which is the one thing it was not.
          key="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"

          if [ -z "$key" ]; then
            if [ "${{ inputs.require_signing }}" = "true" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is empty or not set. A published APK must not carry the shared Android debug key — see docs/deployment/code-signing.md."
              exit 1
            fi
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; producing a debug-signed build. Fine for testing, never for publication."
            exit 0
          fi

          # Sizes only, never the value: enough to tell a truncated paste from a
          # whole one without putting the key in the log.
          echo "Keystore secret present: ${#key} base64 characters."

          if ! printf '%s' "$key" | base64 --decode > "$RUNNER_TEMP/upload.keystore" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but is not valid base64. Re-encode the keystore and paste the whole of the single line it produces."
            exit 1
          fi

          size=$(wc -c < "$RUNNER_TEMP/upload.keystore")
          echo "Decoded $size bytes."

          if [ "$size" -lt 1000 ]; then
            echo "::error::The decoded keystore is $size bytes, far too small to be one. The secret is truncated — paste the whole base64 line."
            exit 1
          fi

          # Proves the keystore, its password and its alias agree here, rather
          # than twenty minutes later inside Gradle behind a less direct message.
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.keystore" \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                 -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore decoded, but will not open with ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS. One of those two secrets is wrong."
            exit 1
          fi
          echo "Keystore opens with the supplied password and carries the alias."

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build APK (testing)
        working-directory: apps/mobile/android
        env:
          NOTO_UPLOAD_STORE_FILE: ${{ steps.keystore.outputs.available == 'true' && format('{0}/upload.keystore', runner.temp) || '' }}
          NOTO_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOTO_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOTO_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Produces one APK per ABI rather than a universal one — see
        # `apps/mobile/plugins/with-android-app-size.cjs`.
        run: ./gradlew assembleRelease --no-daemon

      - name: Build AAB (Play Store)
        working-directory: apps/mobile/android
        env:
          NOTO_UPLOAD_STORE_FILE: ${{ steps.keystore.outputs.available == 'true' && format('{0}/upload.keystore', runner.temp) || '' }}
          NOTO_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOTO_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOTO_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Play splits the bundle per device itself, so the per-ABI APK splits
        # that `assembleRelease` needs are turned off for this task.
        run: ./gradlew bundleRelease --no-daemon -Pnoto.enableAbiSplits=false

      - name: Rename outputs
        run: |
          mkdir -p build
          v="${{ steps.version.outputs.value }}"
          out=apps/mobile/android/app/build/outputs

          # Named explicitly rather than globbed: `assembleRelease` now emits
          # one APK per ABI, including the emulator-only x86 pair, and a `find`
          # would copy all four over each other in whatever order it walked
          # them. Missing files are an error — a silently absent APK would
          # publish a release with a dead download button on it.
          cp "$out/apk/release/app-arm64-v8a-release.apk" "build/Noto-$v-android.apk"
          cp "$out/apk/release/app-armeabi-v7a-release.apk" "build/Noto-$v-android-armeabi-v7a.apk"
          cp "$out/bundle/release/app-release.aab" "build/Noto-$v-android.aab"

          ls -lh build

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: build
          retention-days: 14
          if-no-files-found: error

      - name: Remove signing material
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/upload.keystore"

  ios:
    name: iOS
    if: inputs.ios
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            node scripts/version.mjs set "${{ inputs.version }}"
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # Bounded and run from the package directory for the same reasons as the
      # Android step above.
      - name: Generate native iOS project
        run: |
          node ../../scripts/run-with-retry.mjs --timeout 5 --attempts 2 -- \
            pnpm exec expo prebuild --platform ios --no-install --clean
        working-directory: apps/mobile

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      # Without an Apple Developer team this produces an unsigned archive, which
      # is enough to prove the project builds. TestFlight and App Store uploads
      # require enrollment and are handled by a signed run.
      - name: Build archive
        working-directory: apps/mobile/ios
        run: |
          workspace=$(ls -d *.xcworkspace | head -n 1)
          scheme="${workspace%.xcworkspace}"
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Noto.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: ${{ runner.temp }}/Noto.xcarchive
          retention-days: 14
          if-no-files-found: error
