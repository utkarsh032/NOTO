<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noto</title>
    <meta name="description" content="Noto — a local-first notes and document workspace." />
    <script>
      // Applied before first paint so a dark-theme user never sees a light flash.
      (() => {
        try {
          const stored = localStorage.getItem('noto.settings');
          const mode = stored ? JSON.parse(stored)?.appearance?.theme : 'system';
          const dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
